# CloudPanel-Vhost für Maptale — in den Vhost-Editor der Site einfügen
# (CloudPanel → Sites → <deine Site> → Vhost). CloudPanel liefert das
# umschließende server{}-Gerüst inkl. TLS; hier stehen die location-Blöcke, die
# den statischen Web-Build ausliefern und /api an die lokale API weiterreichen.
#
# WICHTIG: Der API-Container ist auf 127.0.0.1:8790 veröffentlicht (Host-Port in
# docker-compose.cloudpanel.yml; container-intern 8787) — nur dieser Nginx
# erreicht ihn, nichts von außen. Beide Ports müssen zusammenpassen.

# --- Uploads: GPX, Fotos, VIDEOS. Nginx-Default ist 1 MB → würde Uploads
# --- sofort mit 413 abwürgen. An das Server-Limit (500 MB Medien) + Luft anpassen.
client_max_body_size 600m;

# --- Statischer Web-Build (dist/ liegt im Document-Root der Site) ---
#
# URLs ohne `.html`: `$uri.html` deckt /erlebnis, /galerie, /profil, /admin,
# /impressum und /datenschutz ab — für jede gibt es eine gleichnamige Datei.
# Der URL-Raum steht in src/routen.ts.
#
# `add_header Cache-Control` ist Pflicht, nicht Kosmetik: Ohne Cache-Direktive
# cacht der Browser die HTML-Antwort heuristisch und behält sie über einen
# Deploy hinweg — mitsamt der Verweise auf dann gelöschte gehashte Assets.
#
# Und deshalb steht der `include` davor: **Ein `add_header` in einer Location
# unterdrückt ALLE geerbten** — nginx vererbt nur, solange die aktuelle Ebene
# selbst keines deklariert. Ohne diese Zeile fielen X-Frame-Options,
# X-Content-Type-Options und Referrer-Policy aus `global_settings` ersatzlos
# weg. Das galt auch für CloudPanels EIGENE Blöcke; sie brauchen denselben
# Include (s. Kasten unten).
# Umami Analytics Reverse-Proxy (Proxy-Pass an den lokalen Umami-Docker-Container)
location ^~ /umami/ {
    proxy_pass http://127.0.0.1:3000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Next.js statische Chunks für Umami Dashboard
location ^~ /_next/ {
    proxy_pass http://127.0.0.1:3000/_next/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location / {
    include /etc/nginx/global_settings;
    add_header Cache-Control "no-cache" always;
    # `=404` und nicht `/index.html`: Es gibt keinen Client-Router, der einen
    # Fallback bräuchte — jeder Pfad ist eine echte Datei. Eine vertippte
    # Adresse mit 200 und der Landing zu beantworten, wäre eine Lüge an den
    # Browser wie an Suchmaschinen (Soft-404).
    try_files $uri $uri.html $uri/ =404;
}

# Gestaltete Fehlerseite statt Nginx' nacktem Standardtext. Sie liegt in
# public/404.html (Vite kopiert public/ unverändert nach dist/) und ist
# vollständig inline — kein Import, kein gehashtes Asset: Eine Fehlerseite muss
# auch dann stehen, wenn genau das kaputt ist, was sie melden soll.
#
# Der Status bleibt 404 (kein `=200`). Für /api/ gilt das NICHT: Nginx fasst
# Antworten der Upstream nicht an, solange `proxy_intercept_errors` aus ist
# (Default) — die API antwortet weiter mit JSON, nicht mit dieser HTML-Seite.
error_page 404 /404.html;

# --- Die drei Pfade auf studio.html ---
# Sie brauchen eigene Blöcke, weil es keine app.html/anmelden.html gibt:
# `$uri.html` liefe ins Leere und fiele auf die Landing zurück. `location =`
# (exakte Übereinstimmung) schlägt in Nginx die Prefix-Location oben.
#
# `rewrite … last` statt `try_files`, damit die Antwort die Location-Suche NEU
# durchläuft und als /studio.html dieselben Regeln bekommt wie ein direkter
# Aufruf — in CloudPanels Gerüst ist das der `location ~* \.html$`-Block mit
# `Cache-Control: no-cache`. Mit try_files bliebe die HTML-Antwort ohne
# Cache-Direktive und der Browser cachte sie heuristisch über einen Deploy
# hinweg. Der Query-String bleibt dabei erhalten (/app?edit=… → /studio.html?edit=…),
# und der Browser sieht keine Weiterleitung: die Umschreibung ist intern.
#
# WICHTIG: Ohne diese Blöcke landet jeder Anmelde- und Bestätigungslink auf
# der Startseite — dieser Vhost muss VOR dem Rollout aktualisiert sein.
location = /app          { rewrite ^ /studio.html last; }
location = /anmelden     { rewrite ^ /studio.html last; }
location = /registrieren { rewrite ^ /studio.html last; }

# --- Nachtrag an CloudPanELS EIGENEN Blöcken (stehen NICHT in dieser Datei) ---
#
# Der Vhost auf dem Server ist CloudPanels Gerüst, nicht diese Datei — dort gibt
# es drei weitere Locations mit eigenem `add_header`, die dadurch dieselben
# geerbten Header verlieren. In jede gehört als ERSTE Zeile:
#
#     include /etc/nginx/global_settings;
#
#   location = / { … }                          — die Landing
#   location ~* \.html$ { … }                   — alle .html (dorthin schreiben
#                                                 die drei Blöcke oben um)
#   location ~* ^.+\.(css|js|jpg|…)$ { … }      — Assets und Medien
#
# Im Asset-Block dabei `add_header alt-svc 'h3=":443"; ma=86400';` STREICHEN:
# dieselbe Zeile steht in global_settings, sonst geht der Header doppelt raus.
# Gegenprobe (muss 3 sein, auf jeder Antwort — HTML, Asset, /api):
#
#     curl -sI https://maptale.henrikheil.net/app \
#       | grep -icE 'x-frame-options|x-content-type-options|referrer-policy'

# Gehashte Vite-Assets sind unveränderlich → aggressiv cachen.
location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
}

# index.html nie langfristig cachen, damit neue Deploys sofort greifen.
location = /index.html {
    add_header Cache-Control "no-cache";
}

# --- API + Medien an den lokalen Fastify-Container ---
# ^~ ist PFLICHT, wenn der (Static-Site-)Vhost eine Datei-Endungs-Regex enthält
# (…\.(mp4|jpg|png|ogg|…)$ — CloudPanels Standard-Template hat genau das): in
# Nginx schlagen Regex-Locations Prefix-Locations, sonst würde /api/.../*.mp4
# bzw. *.jpg von der Regex abgefangen und die API-Antwort verschluckt (404).
location ^~ /api/ {
    proxy_pass http://127.0.0.1:8790;
    proxy_http_version 1.1;

    # Echte Client-IP + Protokoll an die API (die vertraut dem Proxy: trustProxy).
    # Ohne X-Forwarded-For griffen die Rate-Limits (Login/Registrierung) global.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Große Uploads durchstreamen statt in Nginx zu puffern; Video-Transkodierung
    # kann dauern → großzügige Timeouts. Range-Requests (Video-Seeking) reicht
    # Nginx unverändert durch.
    proxy_request_buffering off;
    proxy_read_timeout  300s;
    proxy_send_timeout  300s;
}
