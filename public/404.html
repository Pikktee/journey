<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Seite nicht gefunden · Maptale</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    rel="preload"
    as="font"
    type="font/woff2"
    href="https://fonts.gstatic.com/s/outfit/v15/QGYvz_MVcBeNP4NJtEtqUYLknw.woff2"
    crossorigin
  />
  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <!--
    Diese Seite liegt in public/ und wird von Vite unverändert nach dist/
    kopiert: keine Imports, kein gehashtes Asset, alles inline. Eine
    Fehlerseite muss auch dann stehen, wenn genau das kaputt ist, was sie
    melden soll — ein fehlendes Bundle darf sie nicht mitreißen.
    Eingehängt über `error_page 404 /404.html;` im Vhost.
  -->
  <style>
    /* Der EINE Ort, an dem die Marken-Tokens ein zweites Mal stehen dürfen —
       src/basis.css ist ein gehashtes Asset, und genau das könnte fehlen, wenn
       diese Seite gebraucht wird. Die Werte müssen deshalb von Hand mit
       DESIGN.md mitgehen; der Wächter in test/basis-css.test.ts prüft sie. */
    :root {
      --bg: #090c11;
      --bg-tief: #06080c;
      --rand: #232d3d;
      --text: #f2ede3;
      --text-2: #a7b1bf;
      --text-3: #7e8a99;
      --akzent: #f59e0b;
      --akzent-2: #ff6f52;
      --font-ui: 'Outfit', 'Outfit Fallback', system-ui, -apple-system, sans-serif;
    }
    /* Wie basis.css: Metrik-Zwilling, sonst springt der Text beim Outfit-Swap. */
    @font-face {
      font-family: 'Outfit Fallback';
      src: local('Arial');
      size-adjust: 101.7%;
      ascent-override: 92%;
      descent-override: 24%;
      line-gap-override: 0%;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: var(--font-ui);
      color: var(--text);
      background:
        radial-gradient(120% 90% at 15% 8%, rgba(245, 165, 36, 0.08), transparent 55%),
        radial-gradient(100% 100% at 85% 96%, rgba(255, 111, 82, 0.06), transparent 60%),
        linear-gradient(160deg, #0b0f16, var(--bg-tief));
      background-color: var(--bg);
      display: grid;
      place-items: center;
      padding: 32px 24px;
      -webkit-font-smoothing: antialiased;
    }

    /* Oben links steht genau EIN Element: der Weg hinaus (wie im Player). */
    .zurueck {
      position: fixed; top: 30px; left: 32px;
      display: inline-flex; align-items: center; gap: 0.45em;
      font-size: 19px; font-weight: 500; letter-spacing: -0.01em;
      color: var(--text); text-decoration: none;
    }
    .zurueck svg { width: 25px; height: 25px; translate: 0 1px; }

    .mitte { width: min(660px, 100%); text-align: center; }

    /* — Die Szene: die Strecke franst aus und erreicht den Halt nicht mehr — */
    .szene { width: 100%; height: auto; display: block; margin-bottom: 34px; }
    .weg-voll {
      fill: none; stroke: url(#verlauf); stroke-width: 2.8; stroke-linecap: round;
      /* pathLength=1 steht am PFAD in <defs> — am <use> wäre es wirkungslos. */
      stroke-dasharray: 0.63 1;
    }
    .weg-lose {
      fill: none; stroke: var(--akzent); stroke-width: 2.8; stroke-linecap: round;
      stroke-dasharray: 0.008 0.017; mask: url(#ausfransen);
    }
    .pin .ring { fill: none; stroke: rgba(245, 158, 11, 0.5); stroke-width: 1.4; }
    .pin .mast { stroke: rgba(245, 158, 11, 0.65); stroke-width: 1.6; }
    .pin .scheibe { fill: #0b0f16; stroke: var(--akzent); stroke-width: 2; }
    .pin text {
      fill: var(--text); font-family: var(--font-ui); font-size: 13px; font-weight: 600;
      text-anchor: middle; font-variant-numeric: tabular-nums;
    }
    /* Der Halt, den es nicht gibt: gestrichelt, gedämpft, ohne Anschluss. */
    .pin-fehlt .ring { stroke: rgba(103, 114, 127, 0.5); stroke-dasharray: 3 4; }
    .pin-fehlt .mast { stroke: rgba(103, 114, 127, 0.5); stroke-dasharray: 3 4; }
    .pin-fehlt .scheibe { fill: #0b0f16; stroke: var(--text-3); stroke-dasharray: 4 4.5; }
    /* Die Zahl ist die Pointe — sie muss lesbar sein, auch wenn drumherum
       alles „nicht vorhanden" signalisiert. */
    .pin-fehlt text { fill: var(--text); font-size: 18px; font-weight: 550; }

    /* Einmal aufziehen, nicht in Schleife: eine Fehlerseite darf nicht zappeln. */
    .weg-voll { animation: zeichnen 1.5s cubic-bezier(0.45, 0, 0.25, 1) 0.15s backwards; }
    @keyframes zeichnen { from { stroke-dasharray: 0 1; } }
    .weg-lose { animation: einblenden 1.1s ease 1.2s backwards; }
    .pin { animation: setzen 620ms cubic-bezier(0.2, 1.5, 0.35, 1) backwards;
           transform-box: fill-box; transform-origin: 50% 100%; }
    .pin-1 { animation-delay: 0.55s; }
    .pin-2 { animation-delay: 1.0s; }
    .pin-fehlt { animation-delay: 1.75s; }
    @keyframes setzen { from { opacity: 0; transform: scale(0.4) translateY(9px); } }
    @keyframes einblenden { from { opacity: 0; } }

    h1 {
      font-size: clamp(30px, 4.6vw, 44px); line-height: 1.08; letter-spacing: -0.015em;
      font-weight: 480; margin: 0 0 16px; text-wrap: balance;
    }
    .satz {
      color: var(--text-2); font-size: 16px; line-height: 1.55;
      max-width: 46ch; margin: 0 auto 32px; text-wrap: balance;
    }

    .wege { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    .knopf {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 12px 22px; border-radius: var(--radius-full);
      font-family: var(--font-ui); font-size: 15px; font-weight: 550; letter-spacing: -0.01em;
      text-decoration: none; border: 1px solid transparent;
      transition: transform 0.18s ease, box-shadow 0.22s ease, border-color 0.22s ease, color 0.22s ease;
    }
    .knopf-primaer {
      background: linear-gradient(100deg, var(--akzent), var(--akzent-2));
      color: #14100a;
      box-shadow: 0 8px 24px rgba(245, 158, 11, 0.22);
    }
    .knopf-primaer:hover { transform: translateY(-1px); box-shadow: 0 12px 30px rgba(245, 158, 11, 0.32); }
    .knopf-geist { border-color: var(--rand); color: var(--text); }
    .knopf-geist:hover { border-color: rgba(245, 158, 11, 0.55); transform: translateY(-1px); }
    .knopf:focus-visible { outline: 2px solid var(--akzent); outline-offset: 2px; }

    .leise { margin: 26px 0 0; font-size: 13.5px; color: var(--text-3); }
    .leise a { color: var(--text-2); text-decoration: none; border-bottom: 1px solid var(--rand); }
    .leise a:hover { color: var(--text); border-color: rgba(245, 158, 11, 0.55); }

    @media (max-width: 640px) {
      .zurueck { top: 20px; left: 20px; font-size: 17px; }
      .mitte { padding-top: 40px; }
      /* Feste Höhe statt `auto` — erst dadurch greift `preserveAspectRatio`
         mit `slice` und beschneidet die Breite. Verankert an xMax zeigt das
         Handy den RECHTEN Ausschnitt (Ausfransen + der Halt dahinter) statt
         die ganze Strecke in Briefmarkengröße: 57 % größer, und der Teil, der
         die Sache erklärt, ist der, der übrig bleibt. */
      .szene { height: 140px; margin-bottom: 26px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .weg-voll, .weg-lose, .pin { animation: none; }
      .knopf { transition: none; }
      .knopf:hover { transform: none; }
    }
  </style>
</head>
<body>
  <a class="zurueck" href="/" aria-label="Zur Startseite">
    <svg viewBox="2.4 2.4 35.2 35.2" aria-hidden="true">
      <defs><linearGradient id="markeRoute" gradientUnits="userSpaceOnUse" x1="4.4" y1="23.4" x2="35.6" y2="15.8">
        <stop offset="0" stop-color="#F0940A"/><stop offset="1" stop-color="#FF8A5C"/>
      </linearGradient></defs>
      <g fill="none" stroke="#F59E0B" stroke-width="1.25" opacity="0.78" stroke-linecap="round">
        <path d="M 33.41 12.85 A 15.2 15.2 0 0 0 4.8 19.81"/><path d="M 6.26 26.49 A 15.2 15.2 0 0 0 35.19 19.45"/>
      </g>
      <g transform="rotate(-17 20 20)" fill="none" stroke="#F59E0B" stroke-width="0.8" opacity="0.3">
        <line x1="4.8" y1="20" x2="35.2" y2="20"/><line x1="7.11" y1="11.95" x2="32.89" y2="11.95"/>
        <line x1="7.11" y1="28.05" x2="32.89" y2="28.05"/><ellipse cx="20" cy="20" rx="8.5" ry="15.2"/>
      </g>
      <path d="M 4.4 23.4 C 12.4 13.4, 27.2 26.6, 35.6 15.8" fill="none" stroke="url(#markeRoute)" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="4.4" cy="23.4" r="1.6" fill="#F59E0B"/><circle cx="35.6" cy="15.8" r="1.9" fill="#F2EDE3"/>
    </svg>
    Maptale
  </a>

  <main class="mitte">
    <svg class="szene" viewBox="0 0 720 210" preserveAspectRatio="xMaxYMid slice" role="img"
         aria-label="Eine Route mit nummerierten Halten; danach franst sie aus und hört auf. Der letzte Halt, mit 404 beschriftet, steht ohne Anschluss dahinter.">
      <defs>
        <linearGradient id="verlauf" gradientUnits="userSpaceOnUse" x1="0" y1="170" x2="700" y2="90">
          <stop offset="0" stop-color="#F59E0B" stop-opacity="0.32"/>
          <stop offset="0.55" stop-color="#F59E0B"/>
          <stop offset="1" stop-color="#FF6F52"/>
        </linearGradient>
        <!-- Der Übergang: die Striche treten dort hervor, wo die volle Linie
             endet, und geben VOR dem letzten Halt auf (schwarz ab 0,84 — der
             Halt steht bei 0,91). Der Abstand ist die Aussage: Die Strecke
             reicht nicht bis dorthin. Kein harter Schnitt am Anfang. -->
        <linearGradient id="fransen" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0.55" stop-color="#000"/>
          <stop offset="0.68" stop-color="#fff"/>
          <stop offset="0.78" stop-color="#fff" stop-opacity="0.55"/>
          <stop offset="0.84" stop-color="#000"/>
        </linearGradient>
        <mask id="ausfransen"><rect x="0" y="0" width="720" height="210" fill="url(#fransen)"/></mask>
        <path id="weg" pathLength="1"
              d="M 10 176 C 96 186, 150 128, 240 124 C 328 120, 366 172, 456 168 C 548 164, 596 116, 710 100"/>
      </defs>

      <use class="weg-voll" href="#weg"/>
      <use class="weg-lose" href="#weg"/>

      <!-- Die Fußpunkte sind AUS der Kurve gerechnet (getPointAtLength bei
           0,15 / 0,48 / 0,92), nicht geschätzt: gesetzte Werte standen 16,2 /
           4,4 / 0,3 Einheiten daneben — bei einem Fußring von 15 × 5,5 sieht
           man das. Dieselbe Regel wie in der Anmeldebühne des Studios. -->
      <g class="pin pin-1">
        <ellipse class="ring" cx="116" cy="158.1" rx="15" ry="5.5"/>
        <line class="mast" x1="116" y1="158.1" x2="116" y2="116.1"/>
        <circle class="scheibe" cx="116" cy="108.1" r="13"/>
        <text x="116" y="113.1">1</text>
      </g>
      <g class="pin pin-2">
        <ellipse class="ring" cx="346.6" cy="145.7" rx="15" ry="5.5"/>
        <line class="mast" x1="346.6" y1="145.7" x2="346.6" y2="103.7"/>
        <circle class="scheibe" cx="346.6" cy="95.7" r="13"/>
        <text x="346.6" y="100.7">2</text>
      </g>
      <!-- Der Halt, den es nicht gibt. In Maptale trägt jeder Halt eine
           Nummer — dieser trägt die des Fehlers, und die Strecke reicht
           nicht mehr bis zu ihm. -->
      <g class="pin pin-fehlt">
        <ellipse class="ring" cx="653.3" cy="111.6" rx="19" ry="6.5"/>
        <line class="mast" x1="653.3" y1="111.6" x2="653.3" y2="59.6"/>
        <circle class="scheibe" cx="653.3" cy="47.6" r="21"/>
        <text x="653.3" y="54">404</text>
      </g>
    </svg>

    <!-- Der Satz sagt zuerst, WAS los ist. „Hier endet die Strecke" war das
         schönere Bild, aber auf einer Fehlerseite will man nicht deuten
         müssen: Das Bild trägt die Szene darüber, die Schrift trägt die
         Auskunft. Danach zwei ausgeschriebene Sätze statt einer
         Gedankenstrich-Aufzählung — sie nennen die zwei wahrscheinlichen
         Gründe, und mit beiden kann der Leser etwas anfangen. -->
    <h1>Seite nicht gefunden</h1>
    <p class="satz">
      Diese Adresse gibt es nicht. Vielleicht hast du dich vertippt, oder die
      Tour steht inzwischen auf privat.
    </p>

    <div class="wege">
      <a class="knopf knopf-primaer" href="/">Zur Startseite</a>
      <a class="knopf knopf-geist" href="/galerie">Touren entdecken</a>
    </div>

    <p class="leise">Du hast ein Konto? <a href="/app">Zu deinen Touren</a></p>
  </main>
</body>
</html>
