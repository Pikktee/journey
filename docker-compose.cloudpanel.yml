# Maptale auf einem Server MIT CloudPanel: Anders als docker-compose.yml läuft
# hier NUR die API im Container — den Webserver, TLS und den /api-Reverse-Proxy
# übernimmt CloudPanels Nginx (siehe deploy/cloudpanel-nginx.conf). Der Caddy-
# „web"-Service entfällt, damit es keinen Konflikt um Port 80/443 gibt.
#
# Die API bindet NUR an 127.0.0.1 — von außen unerreichbar, nur CloudPanels
# Nginx auf demselben Host proxyt dorthin. Der statische Web-Build (dist/) wird
# per rsync in das CloudPanel-Site-Verzeichnis geschoben (nicht hier).
#
# Erstbetrieb:
#   1. In CloudPanel eine Site für die Domain anlegen, Reverse-Proxy-Block aus
#      deploy/cloudpanel-nginx.conf in die Vhost eintragen, SSL aktivieren.
#   2. /srv/maptale/.env füllen (SITE-Angaben s. README-Tabelle).
#   3. docker compose -f docker-compose.cloudpanel.yml up -d

services:
  api:
    image: ghcr.io/pikktee/journey-api:latest
    restart: unless-stopped
    # NUR Loopback veröffentlichen: erreichbar allein für CloudPanels Nginx.
    ports:
      # Host-Port 8790 (nicht 8787): auf dem Zielserver lauscht auf 127.0.0.1:8787
      # bereits ein anderer Node-Dienst. Container-intern bleibt es 8787. Muss zum
      # proxy_pass im CloudPanel-Vhost (deploy/cloudpanel-nginx.conf) passen.
      - '127.0.0.1:8790:8787'
    environment:
      MAPTALE_DATEN_DIR: /data
      MAPTALE_COOKIE_SECRET: ${MAPTALE_COOKIE_SECRET:?MAPTALE_COOKIE_SECRET in .env setzen}
      MAPTALE_ADMIN_EMAIL: ${MAPTALE_ADMIN_EMAIL:-}
      MAPTALE_ADMIN_PASSWORT: ${MAPTALE_ADMIN_PASSWORT:-}
      # Adressen, die bei jedem Start die Admin-Rolle bekommen (kommagetrennt).
      # Ungesetzt greift der Default aus server/src/config.ts — leer lassen
      # bedeutet also NICHT „keine Admins", sondern „die eingebauten".
      MAPTALE_ADMINS: ${MAPTALE_ADMINS:-}
      # Hinter CloudPanels TLS-Nginx: Cookies bekommen `secure`.
      MAPTALE_HINTER_TLS: '1'
      # Mehrbenutzer-Betrieb (M9)
      MAPTALE_BASIS_URL: ${MAPTALE_BASIS_URL:-}
      # Woher der Container das GEBAUTE profil.html holt, wenn er /@handle
      # selbst beantwortet (server/src/seiten.ts). Leer = wie MAPTALE_BASIS_URL,
      # und das ist der Normalfall: Es ist derselbe Nginx, der die Datei auch
      # dem Browser ausliefert — ein Abruf alle fünf Minuten.
      #
      # 127.0.0.1 ginge nicht ohne Weiteres: Der HTTP-Vhost leitet auf HTTPS um,
      # und HTTPS auf die Loopback-Adresse scheitert am Zertifikatsnamen. Der
      # Umweg über den öffentlichen Namen kostet einen TLS-Handshake pro
      # Cache-Periode und spart dafür jede Sonderbehandlung.
      MAPTALE_WEB_URL: ${MAPTALE_WEB_URL:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAPTALE_MAIL_ABSENDER: ${MAPTALE_MAIL_ABSENDER:-}
      MAPTALE_MAX_SPEICHER_PRO_BENUTZER: ${MAPTALE_MAX_SPEICHER_PRO_BENUTZER:-}
      MAPTALE_REGISTRIERUNG_OFFEN: ${MAPTALE_REGISTRIERUNG_OFFEN:-}
      # Wetter-Bildanalyse (M5) — optional: ohne Key ist das Feature aus (No-Op).
      # Vision-Modell läuft über OpenRouter; MAPTALE_VISION_MODELL überschreibt den Default.
      OPEN_ROUTER_KEY: ${OPEN_ROUTER_KEY:-}
      MAPTALE_VISION_MODELL: ${MAPTALE_VISION_MODELL:-}
      # Reichweitenmessung: Passwort der Umami-Postgres (Nachbar-Container).
      # Fehlt es, bleibt der Statistik-Reiter der Verwaltung auf Null.
      MAPTALE_UMAMI_DB_PASSWORT: ${MAPTALE_UMAMI_DB_PASSWORT:-}
    volumes:
      - /srv/maptale/daten:/data
