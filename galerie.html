<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <script defer src="https://analytics.maptale.io/script.js" data-website-id="9f8e7d6c-5b4a-3f2e-1d0c-9b8a7f6e5d4c"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Entdecken · Maptale</title>
  <meta name="description" content="Öffentlich geteilte Reisen & Touren erkunden — als 3D-Kamerafahrt über die echte Strecke." />
  <!-- Vorschaukarte: feste Marken-Werte. Die Karten der Galerie kommen aus der
       API, die Bots führen kein JavaScript aus — was hier nicht im HTML steht,
       sieht niemand. Siehe index.html. -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Maptale" />
  <meta property="og:locale" content="de_DE" />
  <meta property="og:url" content="https://maptale.io/galerie" />
  <meta property="og:title" content="Entdecken · Maptale" />
  <meta
    property="og:description"
    content="Öffentlich geteilte Reisen & Touren erkunden — als 3D-Kamerafahrt über die echte Strecke."
  />
  <meta property="og:image" content="https://maptale.io/og/maptale.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Sonnenaufgang über einem Alpental, darüber der Schriftzug Maptale" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <!-- Sitzungs-Hinweis: Gast-CTA ausblenden, bevor /api/auth/me antwortet. -->
  <script>
    (function () {
      try {
        var dabei = document.cookie.split(';').some(function (c) {
          return c.trim().indexOf('maptale_dabei=') === 0
        })
        if (dabei) document.documentElement.classList.add('nav-dabei')
      } catch (e) {}
    })()
  </script>

  <!-- Marken-Tokens (Farben, Radien, Schrift) — src/basis.css, abgeleitet aus
       DESIGN.md. Steht VOR dem <style>-Block, damit die Seite die Basis
       überschreiben kann und nicht umgekehrt; im Build hält das der
       basisZuerst()-Schritt in vite.config.js nach. -->
  <link rel="stylesheet" href="/src/basis.css" />

  <style>
    /* Entdecken teilt Breite und Navigation mit Studio-Übersicht und Landing.
       Farben, Radien, Schrift und Maße stehen in src/basis.css (s. <link> oben). */

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg-tief);
      color: var(--text);
      font-family: var(--font-ui);
      -webkit-font-smoothing: antialiased;
    }

    .wrap { width: min(var(--wrap), 100% - 44px); margin-inline: auto; }

    nav.nav {
      height: var(--topbar-h);
      border-bottom: 1px solid #222b37;
      background: rgba(13, 17, 24, 0.82);
      backdrop-filter: blur(14px);
      position: sticky; top: 0; z-index: 60;
      display: flex; align-items: center;
    }
    nav.nav .wrap {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 12px;
      width: min(var(--wrap), 100% - 44px);
      height: 100%;
    }
    .brand {
      text-decoration: none; color: var(--text);
      display: inline-flex; align-items: center; gap: 0.45em; flex-shrink: 0;
      font-family: var(--font-display); font-weight: 700; font-size: 17px;
      letter-spacing: -0.02em; line-height: 1;
      justify-self: start;
    }
    .brand img { display: block; height: 28px; width: auto; translate: 0 1px; }
    .top-nav {
      display: flex; align-items: center; gap: 2px; justify-self: center;
    }
    .top-nav a {
      display: inline-flex; align-items: center; gap: 7px;
      color: #a7b1bf; text-decoration: none;
      font-family: var(--font-ui);
      font-size: 13.5px; font-weight: 500; padding: 7px 12px; border-radius: 9px;
      transition: color 0.18s ease, background 0.18s ease;
    }
    .top-nav a svg { width: 15px; height: 15px; flex: none; opacity: 0.88; }
    .top-nav a:hover { color: var(--text); background: rgba(255,255,255,0.06); }
    .top-nav a.aktiv { color: var(--text); background: rgba(255,255,255,0.07); }
    .top-nav a.aktiv svg { opacity: 1; }
    .nav-right { display: flex; align-items: center; gap: 10px; justify-self: end; }
    .nav-right a.nav-cta {
      color: #1a1206; font-weight: 600; font-size: 13.5px; text-decoration: none;
      background: linear-gradient(120deg, var(--akzent), var(--akzent-2));
      padding: 8px 16px; border-radius: 999px;
    }
    .nav-right a.nav-cta:hover { filter: brightness(1.06); }
    html:not(.nav-dabei) [data-dabei] { display: none !important; }
    html.nav-dabei [data-gast] { display: none !important; }
    .konto-wrap { position: relative; }
    .benutzer-chip {
      display: inline-flex; align-items: center; gap: 8px;
      font-family: var(--font-ui); font-size: 13px; font-weight: 500;
      color: #a7b1bf;
      background: #10151d;
      border: 1px solid #222b37; border-radius: 999px;
      padding: 6px 12px 6px 7px; cursor: pointer;
    }
    .benutzer-chip:hover { background: #1c2530; color: var(--text); border-color: #2e3a49; }
    .benutzer-chip[aria-expanded='true'] { border-color: var(--akzent); }
    .benutzer-chip .punkt {
      width: 20px; height: 20px; border-radius: 50%;
      background: linear-gradient(120deg, var(--akzent), var(--akzent-2));
      color: #221302; display: grid; place-items: center;
      font-size: 11px; font-weight: 700; text-transform: uppercase; flex: none;
    }
    .benutzer-chip img.punkt { object-fit: cover; display: block; }
    .konto-menue {
      position: absolute; right: 0; top: calc(100% + 8px); z-index: 80;
      width: 250px; padding: 14px; border-radius: 12px;
      background: #151c26; border: 1px solid #222b37;
      box-shadow: 0 12px 40px rgba(2, 5, 10, 0.6);
      display: flex; flex-direction: column; gap: 10px;
    }
    .konto-menue[hidden] { display: none !important; }
    .km-mail { font-family: var(--font-ui); font-size: 12.5px; font-weight: 500; color: #a7b1bf; word-break: break-all; }
    .km-quota-kopf { display: flex; justify-content: space-between; font-size: 11.5px; color: #67727f; margin-bottom: 6px; }
    .km-balken { height: 6px; border-radius: 3px; background: #10151d; overflow: hidden; }
    .km-balken span { display: block; height: 100%; width: 0; border-radius: 3px; background: linear-gradient(90deg, var(--akzent), var(--akzent-2)); }
    .km-balken span.voll { background: #e8a13c; }
    .km-trenner { height: 1px; background: #222b37; margin: 2px 0; }
    .km-eintrag {
      display: inline-flex; align-items: center; gap: 8px; width: 100%; justify-content: flex-start;
      font-family: var(--font-ui); font-size: 13px; font-weight: 500; color: var(--text); text-decoration: none;
      background: transparent; border: 1px solid transparent; border-radius: 8px; padding: 8px 10px; cursor: pointer;
    }
    .km-eintrag:hover { background: rgba(255,255,255,0.06); text-decoration: none; color: var(--text); }
    .km-eintrag svg { width: 15px; height: 15px; flex: none; }
    @media (max-width: 640px) {
      .top-nav { display: none; }
      nav.nav .wrap { grid-template-columns: 1fr auto; }
    }

    header.kopf { padding: 48px 0 22px; }
    header.kopf h1 { font-family: var(--font-display); font-weight: 700; font-size: clamp(31px, 5vw, 48px); line-height: 1.1; letter-spacing: -0.015em; margin: 0; }
    header.kopf p.lead { color: var(--text-gedaempft); font-size: 17px; line-height: 1.6; max-width: 54ch; margin: 14px 0 0; }

    .gitter { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 22px; padding: 22px 0 8px; }

    .karte { border: 1px solid var(--linie); border-radius: 14px; overflow: hidden; background: var(--tafel); transition: transform 0.18s ease, border-color 0.18s ease; }
    .karte:hover { transform: translateY(-3px); border-color: rgba(255, 255, 255, 0.2); }
    .karte:focus-within { border-color: rgba(255, 255, 255, 0.2); }
    .karte-haupt { display: block; text-decoration: none; color: inherit; }
    .karte-haupt:focus-visible { outline: 2px solid var(--akzent); outline-offset: -2px; }
    .karte-bild { aspect-ratio: 3 / 2; background: rgba(255, 255, 255, 0.05); }
    .karte-bild img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .karte-text { padding: 15px 17px 17px; }
    .karte-text h3 { font-family: var(--font-display); font-weight: 600; font-size: 21px; line-height: 1.2; margin: 0; }
    .karte-meta { font-family: var(--font-ui); font-size: 13px; font-weight: 500; color: var(--text-zart); margin: 7px 0 0; }
    .karte-autor { display: flex; align-items: center; gap: 8px; padding: 0 17px 16px; font-size: 13.5px; color: var(--text-gedaempft); text-decoration: none; }
    a.karte-autor:hover { color: var(--text); }
    .karte-autor img { width: 24px; height: 24px; border-radius: 50%; object-fit: cover; }

    .mehr-zeile { display: flex; justify-content: center; padding: 26px 0 70px; }
    button#mehr { font-family: var(--font-ui); font-size: 13.5px; font-weight: 500; color: var(--text); background: transparent; border: 1px solid var(--linie); border-radius: 999px; padding: 11px 26px; cursor: pointer; }
    button#mehr:hover { border-color: rgba(255, 255, 255, 0.28); }
    button#mehr:disabled { opacity: 0.5; cursor: default; }

    footer { border-top: 1px solid var(--linie); padding: 26px 0 40px; }
    footer .wrap { display: flex; flex-wrap: wrap; gap: 8px 20px; justify-content: space-between; font-family: var(--font-ui); font-size: 13px; color: var(--text-zart); }
    footer a { color: var(--text-zart); text-decoration: none; }
    footer a:hover { color: var(--text); }

    @media (prefers-reduced-motion: reduce) { .karte { transition: none; } }
  </style>
</head>
<body>
  <nav class="nav">
    <div class="wrap">
      <a href="/" class="brand" title="Maptale — Startseite">
        <img src="/logo-mark.svg" alt="" height="28" />
        <span>Maptale</span>
      </a>
      <nav class="top-nav" aria-label="Hauptnavigation">
        <!-- Icons: src/app-nav.ts — Drift-Wächter in test/app-nav.test.ts -->
        <a href="/app"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 17l4-10 4 6 3-4 5 8"/><circle cx="8" cy="7" r="1.4"/><circle cx="19" cy="17" r="1.4"/></svg>Meine Touren</a>
        <a href="/galerie" class="aktiv"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M4 12h16M12 4c2.5 2.5 2.5 13 0 16-2.5-3-2.5-13.5 0-16z"/></svg>Entdecken</a>
      </nav>
      <div class="nav-right" id="nav-right">
        <a href="/app" class="nav-cta" data-gast>Anmelden</a>
        <div class="konto-wrap" data-dabei>
          <button type="button" class="benutzer-chip" disabled aria-busy="true" aria-label="Profil wird geladen">
            <span class="punkt"></span>
            <span class="nav-profil-name">&nbsp;</span>
          </button>
        </div>
      </div>
    </div>
  </nav>

  <header class="kopf">
    <div class="wrap">
      <h1>Reisen &amp; Touren entdecken</h1>
      <p class="lead">
        Aufgezeichnete Touren, die ihre Urheber öffentlich gestellt haben — jede
        als Kamerafahrt über die echte Strecke, mit den Fotos an dem Ort, an dem
        sie entstanden sind.
      </p>
    </div>
  </header>

  <main class="wrap">
    <div class="gitter" id="gitter"></div>
    <div class="mehr-zeile"><button id="mehr" type="button" hidden>Mehr anzeigen</button></div>
  </main>

  <footer>
    <div class="wrap">
      <span>Maptale</span>
      <span>
        <a href="/impressum">Impressum</a> ·
        <a href="/datenschutz">Datenschutz</a>
      </span>
    </div>
  </footer>

  <script type="module">
    import { starteGalerie } from '/src/galerie/galerie.ts'
    import { fuelleTopNav, montiereNavRechts } from '/src/app-nav.ts'

    fuelleTopNav(document.querySelector('.top-nav'), 'galerie')
    starteGalerie()
    void montiereNavRechts(document.getElementById('nav-right'))
  </script>
</body>
</html>
