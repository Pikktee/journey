# Einmaliger / manueller API-Image-Build nach GHCR — ohne Full-Release-Gate.
# Nutzen: wenn der Tag-Deploy (android/web) noch blockiert, die API trotzdem
# aktualisieren; oder nach Hotfixes am Server-Image.
#
# Auslösen: gh workflow run api-image.yml

name: API-Image

on:
  workflow_dispatch:

jobs:
  bauen:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: GHCR-Login
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: API-Image bauen + pushen
        uses: docker/build-push-action@v6
        with:
          context: server
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/pikktee/journey-api:latest
            ghcr.io/pikktee/journey-api:maptale-amd64
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
