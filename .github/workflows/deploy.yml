name: Deploy

# Läuft nur bei Version-Tags (vX.Y.Z), erzeugt vom Release-Tool
# (scripts/release.sh bzw. `npm run release`). Ziel: Hetzner-Server mit
# CloudPanel — die API läuft als Docker-Container (GHCR-Image), CloudPanels
# Nginx serviert den statischen Web-Build (dist/, per rsync) und proxyt /api.
# Runbook: docs/ops/deploy-cloudpanel.md.

on:
  push:
    tags:
      - 'v*'

jobs:
  # Test-Gate: kein Deploy ohne grüne Tests (Web + Backend) und Build.
  pruefen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - name: Web — Abhängigkeiten
        run: npm ci
      - name: Web — Tests + Typprüfung + Build
        run: |
          npm test
          npm run typecheck
          npm run build
      - name: Web-Build als Artefakt sichern (für den Deploy-rsync)
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist
          retention-days: 1
      - name: Backend — Abhängigkeiten
        working-directory: server
        run: npm ci
      # Nach beiden Installationen: Der typbasierte Lint braucht die Typen aus
      # server/node_modules, die Formatprüfung hält den einmaligen Format-Stand.
      - name: Lint + Formatprüfung (Web + Server)
        run: |
          npm run lint
          npm run format:check
      - name: Backend — Tests (mit Coverage-Gate) + Typprüfung
        working-directory: server
        run: |
          npm run test:coverage
          npm run typecheck

  # Android-Unit-Tests (JVM/Robolectric — kein Emulator nötig). Die App wird
  # nicht über diesen Workflow ausgeliefert, aber ein kaputter App-Stand soll
  # ein Release genauso blockieren wie Web/Backend.
  pruefen-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Android — Unit-Tests
        working-directory: android
        run: ./gradlew testDebugUnitTest --console=plain

  # Der APK gehört ans GitHub-Release, sonst zeigt der Download-Knopf der Landing
  # (releases/latest/download/maptale-android.apk) auf einen alten Stand — genau
  # das war er, solange der Build von Hand lief: Web bei 0.33, App-Asset bei 0.2.
  # Läuft nach demselben Gate wie der Deploy; Runbook: docs/ops/android-release.md.
  android-apk:
    needs: [pruefen, pruefen-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Volle Historie: die Notizen listen die Commits seit dem letzten
      # App-Release — dafür müssen dessen Tag und die Commits dazwischen da sein.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      # Ohne hinterlegten Schlüssel signiert Gradle mit einem, den der Läufer
      # gerade erzeugt hat — der APK ließe sich dann nicht über eine vorhandene
      # Installation legen. Das Release sagt es unten ausdrücklich.
      - name: Signaturschlüssel bereitlegen (falls hinterlegt)
        id: schluessel
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/debug.keystore"
            echo "pfad=$RUNNER_TEMP/debug.keystore" >> "$GITHUB_OUTPUT"
            echo "stabil=ja" >> "$GITHUB_OUTPUT"
          else
            echo "pfad=" >> "$GITHUB_OUTPUT"
            echo "stabil=nein" >> "$GITHUB_OUTPUT"
          fi
      # Ohne diese Datei baut die App vollständig — nur ohne Push (das
      # google-services-Plugin wird dann gar nicht erst angewandt, s.
      # android/app/build.gradle.kts). Sie gehört nicht ins Repo: Sie ist ein
      # Schlüssel. Einrichtung: docs/ops/push-einrichten.md.
      - name: Firebase-Konfiguration bereitlegen (falls hinterlegt)
        env:
          GOOGLE_SERVICES_B64: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_B64" ]; then
            printf '%s' "$GOOGLE_SERVICES_B64" | base64 -d > android/app/google-services.json
            echo "google-services.json hinterlegt — Push ist in diesem APK an."
          else
            echo "Kein Firebase-Secret — dieses APK kann keine Push-Meldungen empfangen."
          fi
      - name: APK bauen
        working-directory: android
        env:
          MAPTALE_DEBUG_KEYSTORE: ${{ steps.schluessel.outputs.pfad }}
        run: ./gradlew assembleDebug --console=plain
      - name: Release anlegen oder Asset ersetzen
        env:
          GH_TOKEN: ${{ github.token }}
          STABIL: ${{ steps.schluessel.outputs.stabil }}
          WEB_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Version aus derselben Quelle wie die App selbst (s. build.gradle.kts)
          version="$(node -p "require('./package.json').version")"
          tag="android-$version"
          cp android/app/build/outputs/apk/debug/app-debug.apk maptale-android.apk

          # Was seit dem letzten App-Release passiert ist. Ohne Vorgänger (erstes
          # Release) bleibt die Liste weg statt die ganze Historie auszuschütten.
          vorher="$(git tag --list 'android-*' --sort=-v:refname | head -n 1)"
          {
            echo "Gebaut aus **$WEB_TAG**."
            echo
            if [ -n "$vorher" ]; then
              echo "## Änderungen seit $vorher"
              echo
              git log --no-merges --format='- %s' "$vorher..HEAD" -- android/ src/ server/ | head -n 30
              echo
            fi
            echo "---"
            echo
            echo "Debug-Build (nicht für den Play Store). Zum Installieren „Installation aus unbekannten Quellen“ für den Browser erlauben."
            if [ "$STABIL" != "ja" ]; then
              echo
              echo "> **Achtung:** Signiert mit einem flüchtigen Schlüssel des Build-Läufers — eine bereits installierte Maptale-App lässt sich damit *nicht* aktualisieren, sie muss vorher deinstalliert werden. Abhilfe steht in \`docs/ops/android-release.md\`."
            fi
          } > notizen.md

          if gh release view "$tag" >/dev/null 2>&1; then
            # Schon vorhanden (etwa von Hand angelegt): nur die Datei ersetzen,
            # damit ein selbst geschriebener Text nicht überbügelt wird.
            gh release upload "$tag" maptale-android.apk --clobber
          else
            gh release create "$tag" maptale-android.apk \
              --title "Maptale für Android · $version" \
              --notes-file notizen.md
          fi

  deploy:
    needs: [pruefen, pruefen-android]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    # Der Server-Deploy läuft nur, wenn die CloudPanel-Secrets gesetzt sind. Der
    # ERSTE Deploy ist manuell (docs/ops/deploy-cloudpanel.md) — bis die Secrets
    # stehen, baut dieser Job nur das API-Image nach GHCR und überspringt das
    # Ausrollen (der Tag bleibt trotzdem grün).
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      CLOUDPANEL_DOCROOT: ${{ secrets.CLOUDPANEL_DOCROOT }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: GHCR-Login
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Nur die API landet im Container. Den Webserver (statisches dist/) + TLS +
      # /api-Proxy macht CloudPanels Nginx — kein Caddy-„web"-Image mehr.
      - name: API-Image bauen + pushen
        uses: docker/build-push-action@v6
        with:
          context: server
          push: true
          tags: |
            ghcr.io/pikktee/journey-api:latest
            ghcr.io/pikktee/journey-api:${{ github.ref_name }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
      - name: Web-Build laden (für den rsync in den Site-Docroot)
        if: ${{ env.CLOUDPANEL_DOCROOT != '' }}
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: dist
      - name: Auf CloudPanel ausrollen (API-Container + statischer Web-Build)
        # Secrets (docs/ops/deploy-cloudpanel.md, Tabelle in §5): VPS_HOST, VPS_USER,
        # VPS_SSH_KEY, CLOUDPANEL_DOCROOT. Der Deploy-User (VPS_USER) muss Docker
        # ausführen können (root ODER in der docker-Gruppe) UND Schreibrecht im
        # Site-Docroot haben.
        if: ${{ env.CLOUDPANEL_DOCROOT != '' }}
        run: |
          mkdir -p ~/.ssh
          echo "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          # Compose-Datei mitspiegeln, damit Env-Änderungen (neue Keys/Variablen aus dem
          # Repo) auf dem Server ankommen — `docker compose up -d` unten liest sie dann
          # frisch. Ohne diesen Schritt driftet die Server-Datei (Repo ist die Quelle).
          scp -i ~/.ssh/deploy_key docker-compose.cloudpanel.yml "$VPS_USER@$VPS_HOST:/srv/maptale/docker-compose.cloudpanel.yml"
          # API-Container aktualisieren (bindet nur an 127.0.0.1, hinter Nginx)
          ssh -i ~/.ssh/deploy_key "$VPS_USER@$VPS_HOST" \
            'cd /srv/maptale && docker compose -f docker-compose.cloudpanel.yml pull && docker compose -f docker-compose.cloudpanel.yml up -d && docker image prune -f'
          # Statischen Web-Build in den Site-Docroot spiegeln
          rsync -az --delete -e "ssh -i ~/.ssh/deploy_key" dist/ "$VPS_USER@$VPS_HOST:$CLOUDPANEL_DOCROOT/"
